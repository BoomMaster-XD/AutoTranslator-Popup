<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<title>Configuración</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			width: 200px;
			padding: 10px;
			margin: 0;
		}
		.field {
      			margin-bottom: 10px;
    		}
		label {
      			display: block;
      			font-size: 12px;
      			margin-bottom: 3px;
      			font-weight: bold;
    		}
    		select {
      		width: 100%;
      		padding: 5px;
    		}
		button {
			width: 100%;
			padding: 6px;
			background-color: #007bff;
			color: white;
			border: none;
			border-radius: 3px;
			cursor: pointer;
		}
		button:hover {
			background-color: #0056b3;
		}
	</style>
</head>
<body>
	<div class="field">
  		<label for="mode">Modo:</label>
  		<select id="mode">
  			<option value="automatic">Pasivo</option>
  			<option value="click">Activo</option>
  			<option value="off">Off</option>
  		</select>
  	</div>

  	<div class="field">
    		<label for="sourceLang">Idioma de entrada:</label>
    		<select id="sourceLang">
      			<option value="en">Inglés</option>
      			<option value="es">Español</option>
      			<option value="fr">Francés</option>
      			<option value="de">Alemán</option>
    		</select>
  	</div>

  	<div class="field">
    		<label for="targetLang">Idioma de salida:</label>
    		<select id="targetLang">
      			<option value="es">Español</option>
      			<option value="en">Inglés</option>
      			<option value="fr">Francés</option>
      			<option value="de">Alemán</option>
    		</select>
  	</div>

  	<button id="saveBtn">Guardar</button>

  	<script src="popup.js"></script>
</body>
</html>
